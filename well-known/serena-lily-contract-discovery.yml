graphql:
  endpoint: https://www.serenaandlily.com/graphql
  live: true
  anonymous: true
  evidence:
    request: 'POST {"query":"{__typename}"}'
    response: '{"data":{"__typename":"Query"}}'
    http_status: 200
  implementation: AWS AppSync
  implementation_evidence: >-
    Response carries x-amzn-appsync-tokensconsumed and x-amzn-errortype:
    MalformedHttpRequestException.
  introspection: disabled
  introspection_evidence: >-
    Introspection meta-fields are stripped from the schema. A standard introspection query
    returns HTTP 200 with "Validation error of type FieldUndefined: Field 'queryType' in
    type '__Schema' is undefined", and likewise for types, directives, mutationType and
    subscriptionType. __typename still resolves, so the endpoint executes queries — the
    schema is deliberately not published.
  sdl_captured: false
  sdl_captured_reason: >-
    Introspection is disabled and no SDL is published anywhere. NOT FABRICATED — no schema
    was inferred or authored on the provider's behalf.

