method: probed
source: >-
  Live HTTP probes of every Serena & Lily host discovered by DNS enumeration and by the
  site's own rendered navigation, run as STEP 0b of the API Evangelist enrichment pipeline.
summary: >-
  Serena & Lily operates real API infrastructure but publishes no machine-readable contract
  and runs no developer program. The storefront is backed by an AWS AppSync GraphQL
  endpoint that answers anonymous requests with introspection disabled, and by an Amazon
  API Gateway host that rejects every unauthenticated path. No OpenAPI, Swagger, GraphQL
  SDL, AsyncAPI, agent card, MCP endpoint, llms.txt or .well-known document was found.

