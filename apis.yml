  state: none
  reason: no-developer-program
  detail: >-
    Serena & Lily runs real API infrastructure for its own storefront — an AWS AppSync
    GraphQL endpoint at /graphql that answers anonymous queries but has introspection
    deliberately disabled, and an api.serenaandlily.com API Gateway that returns "Missing
    Authentication Token" on every path — yet it operates no developer program at all: no
    developer subdomain resolves, both agent-card paths return a clean 404, the only public
    repo in its GitHub org is a fork of an Amplience CMS extension, and no OpenAPI, SDL,
    SDK or llms.txt is published anywhere.
