aid: serena-lily
name: Serena & Lily
description: >-
  Serena & Lily is a California home furnishings and lifestyle brand founded in 2003 in
  Sausalito by textile designer Serena Dugan and entrepreneur Lily Kanter. It sells
  furniture, custom upholstery, bedding, rugs, lighting, wallpaper, art and home decor
  direct to consumers through its e-commerce site, a printed catalog, and a network of
  physical Design Shops, alongside a Designer Circle trade program for interior designers.
  The storefront runs on a headless, composable commerce stack — Elastic Path for commerce
  and Amplience for content, served from a Vercel-hosted front end in front of AWS AppSync
  and Amazon API Gateway — but Serena & Lily publishes no developer program, no public API
  documentation, and no machine-readable specification of any kind. The GraphQL endpoint
  backing the storefront answers anonymous requests with introspection disabled, and the
  api.serenaandlily.com gateway rejects every unauthenticated path.
